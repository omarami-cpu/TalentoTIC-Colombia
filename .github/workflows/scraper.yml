name: Bot TalentoTIC Diario

on:
  schedule:
    - cron: '0 8 * * *' # Se ejecuta automáticamente todos los días a las 8:00 AM UTC
  workflow_dispatch: # Permite hacer clic en "Run workflow" manualmente desde GitHub

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run bot script
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          python bot_talento_tic.py